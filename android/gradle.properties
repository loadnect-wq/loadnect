# Hallnect Android — Gradle build configuration.

# JVM memory for the Gradle daemon; UTF-8 so Kotlin string literals with the
# rupee sign and em dashes survive on Windows.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX only — no Jetifier because there are no legacy support libraries.
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# R classes stay app-local.
android.nonTransitiveRClass=true

# Faster incremental builds.
org.gradle.caching=true
org.gradle.configuration-cache=true
